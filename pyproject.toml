[project]
name = "aleksa-gordic-jax"
version = "0.1.0"
description = "Following a jax tutorial by Aleksa Gordic."
readme = "README.md"
authors = [
    { name = "DanielJensen0144", email = "jensendaniel0144@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.10",
    "jax>=0.12.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
aleksa-gordic-jax = "aleksa-gordic-jax:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
